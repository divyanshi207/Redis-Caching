services:
  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    restart: always
    volumes:
      - ./volumes/redis-insight:/data

  mysql-db:
    image: mysql:8.0
    container_name: docker-spring-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=Divy@nshi207
      - MYSQL_DATABASE=caching
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Divy@nshi207
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql_data:/var/lib/mysql